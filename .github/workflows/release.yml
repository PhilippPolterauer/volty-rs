name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Build Windows standalone executable
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $metadataJson = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $metadata = $metadataJson | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq "volty-tray" } | Select-Object -First 1
          if ($null -eq $package) {
            throw "Could not find the volty-tray package in cargo metadata."
          }
          $expectedTag = "v$($package.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' must match package version '$expectedTag'."
          }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-features --locked

      - name: Build release executable
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --package volty-tray

      - name: Prepare release assets
        shell: pwsh
        run: |
          $assetName = "Volty-$env:GITHUB_REF_NAME-x86_64-pc-windows-msvc.exe"
          $source = Join-Path $env:GITHUB_WORKSPACE "target\x86_64-pc-windows-msvc\release\volty.exe"
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Release executable was not produced: $source"
          }
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $asset = Join-Path $dist $assetName
          Copy-Item -LiteralPath $source -Destination $asset
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "${asset}.sha256" -Encoding ascii -NoNewline -Value "$hash  $assetName`n"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assetName = "Volty-$env:GITHUB_REF_NAME-x86_64-pc-windows-msvc.exe"
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          $asset = Join-Path $dist $assetName
          $checksum = Join-Path $dist "${assetName}.sha256"
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $asset $checksum --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $asset $checksum --verify-tag --generate-notes
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
