name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  windows-release:
    name: Build Windows standalone, Store, and WinGet packages
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $metadataJson = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $metadata = $metadataJson | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq "volty-tray" } | Select-Object -First 1
          if ($null -eq $package) {
            throw "Could not find the volty-tray package in cargo metadata."
          }
          $expectedTag = "v$($package.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' must match package version '$expectedTag'."
          }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-features --locked

      - name: Build release executable
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --package volty-tray

      - name: Build Microsoft Store package without self-updates
        shell: pwsh
        run: ./scripts/build-msix.ps1 -OutputDirectory "dist/msix/$env:GITHUB_REF_NAME"

      - name: Build portable WinGet package and manifests
        shell: pwsh
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: ./scripts/build-winget.ps1 -Version ($env:GITHUB_REF_NAME.Substring(1)) -Repository $env:RELEASE_REPOSITORY

      - name: Prepare release assets
        shell: pwsh
        run: |
          $assetName = "Volty-$env:GITHUB_REF_NAME-x86_64-pc-windows-msvc.exe"
          $source = Join-Path $env:GITHUB_WORKSPACE "target\x86_64-pc-windows-msvc\release\volty.exe"
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Release executable was not produced: $source"
          }
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $asset = Join-Path $dist $assetName
          Copy-Item -LiteralPath $source -Destination $asset
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "${asset}.sha256" -Encoding ascii -NoNewline -Value "$hash  $assetName`n"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assetName = "Volty-$env:GITHUB_REF_NAME-x86_64-pc-windows-msvc.exe"
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          $storeDist = Join-Path $dist "msix/$env:GITHUB_REF_NAME"
          $assets = @(
            (Join-Path $dist $assetName)
            (Join-Path $dist "${assetName}.sha256")
            (Join-Path $dist "Volty-$env:GITHUB_REF_NAME-winget-x64.zip")
            (Join-Path $dist "Volty-$env:GITHUB_REF_NAME-winget-manifests.zip")
          )
          foreach ($extension in @("msixupload", "msixbundle")) {
            $packages = @(Get-ChildItem -LiteralPath $storeDist -Filter "Volty_*_x64.$extension" -File)
            if ($packages.Count -ne 1) {
              throw "Expected exactly one .$extension package, found $($packages.Count)."
            }
            $assets += $packages[0].FullName
          }
          $releaseJson = gh release view $env:GITHUB_REF_NAME --json isDraft,assets 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --draft --verify-tag --generate-notes
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          } else {
            $release = $releaseJson | ConvertFrom-Json
            if (-not $release.isDraft) {
              foreach ($asset in $assets) {
                $name = Split-Path -Leaf $asset
                if ($name -notin $release.assets.name) {
                  throw "Published release is missing $name."
                }
              }
              exit 0
            }
          }

          # Keep the published WinGet installer hash stable across reruns.
          gh release upload $env:GITHUB_REF_NAME @assets --clobber
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          gh release edit $env:GITHUB_REF_NAME --draft=false
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
