[workspace]
members = [
    "crates/volty-battery",
    "crates/volty-bluetooth",
    "crates/volty-hid",
    "crates/volty-tray",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.89"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
