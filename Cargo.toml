[workspace]
members = [
    "crates/volty-battery",
    "crates/volty-bluetooth",
    "crates/volty-capture",
    "crates/volty-hid",
    "crates/volty-tray",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
volty-battery = { path = "crates/volty-battery" }

[workspace.package]
version = "0.12.0"
edition = "2021"
license = "MIT"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
