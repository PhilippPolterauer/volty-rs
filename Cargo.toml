[workspace]
members = [
    "crates/volty-battery",
    "crates/volty-bluetooth",
    "crates/volty-hid",
    "crates/volty-tray",
]
resolver = "2"

[workspace.dependencies]
toml = "0.8"
volty-battery = { path = "crates/volty-battery" }

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
