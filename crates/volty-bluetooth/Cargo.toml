[package]
name = "volty-bluetooth"
version = "0.3.1"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Bluetooth battery discovery for Volty"

[features]
default = ["windows-backend"]
windows-backend = ["dep:windows", "dep:windows-collections", "dep:windows-future"]

[dependencies]
volty-battery.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", optional = true, features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Bluetooth_Rfcomm",
    "Devices_Enumeration",
    "Foundation",
    "Storage_Streams",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_System_WinRT",
] }
windows-collections = { version = "0.3.2", optional = true }
windows-future = { version = "0.3.2", optional = true }

[lints]
workspace = true