[package]
name = "volty-tray"
version = "0.2.1"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Windows system tray application for Volty"

[features]
default = []
bluetooth = ["dep:volty-bluetooth"]

[[bin]]
name = "volty"
path = "src/main.rs"

[dependencies]
toml.workspace = true
toml_edit = "0.20"

[build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
volty-battery.workspace = true
volty-bluetooth = { path = "../volty-bluetooth", optional = true }
volty-hid = { path = "../volty-hid", features = ["hidapi"] }
tray-icon = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
notify-rust = { version = "4.11", default-features = false }
notify = "8"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }
winreg = "0.52"

[target.x86_64-pc-windows-msvc.dependencies]
rusqlite = { version = "0.41.0", features = ["bundled"], default-features = false }

[lints]
workspace = true