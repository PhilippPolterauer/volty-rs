[package]
name = "volty-tray"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Windows system tray application for Volty"

[features]
default = []
bluetooth = ["volty-bluetooth/windows-backend"]

[[bin]]
name = "volty"
path = "src/main.rs"

[dependencies]
toml.workspace = true
toml_edit = "0.25"

[build-dependencies]
winresource = { version = "0.1", default-features = false }

[target.'cfg(windows)'.dependencies]
volty-battery.workspace = true
volty-bluetooth = { path = "../volty-bluetooth", default-features = false }
volty-capture = { path = "../volty-capture" }
volty-hid = { path = "../volty-hid", features = ["hidapi", "profile"] }
tray-icon = { version = "0.26", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
notify-rust = { version = "4.18", default-features = false }
notify = "8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }
winreg = "0.56"

[target.x86_64-pc-windows-msvc.dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"], default-features = false }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true