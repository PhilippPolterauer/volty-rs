[package]
name = "volty-tray"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Volty battery monitor and diagnostics CLI"

[features]
default = ["bluetooth", "self-update"]
bluetooth = ["volty-bluetooth/windows-backend"]
self-update = [
    "dep:semver",
    "dep:ureq",
    "windows-sys/Win32_Storage_FileSystem",
    "windows-sys/Win32_System_Diagnostics_ToolHelp",
]

[[bin]]
name = "volty"
path = "src/main.rs"

[build-dependencies]
winresource = { version = "0.1", default-features = false }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tempfile = "3"
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
volty-battery.workspace = true
volty-bluetooth = { path = "../volty-bluetooth", default-features = false }
volty-capture = { path = "../volty-capture" }
volty-hid = { path = "../volty-hid" }

[target.'cfg(target_os = "linux")'.dependencies]
volty-hid = { path = "../volty-hid", features = ["hidapi"] }
dbus = "0.9"
dbus-crossroads = "0.5"

[target.'cfg(windows)'.dependencies]
toml.workspace = true
toml_edit = "0.25"
volty-hid = { path = "../volty-hid", features = ["hidapi", "profile"] }
tray-icon = { version = "0.26", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
fontdue = "0.9.3"
notify-rust = { version = "4.18", default-features = false }
notify = "9.0.0-rc.7"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Accessibility",
    "Win32_Security",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
] }
winreg = "0.56"
semver = { version = "1", optional = true }
sha2 = "0.11"
wry = { version = "0.57.1", default-features = false }
tao = { version = "0.37.2", default-features = false, features = ["rwh_06"] }
ureq = { version = "2.12", default-features = false, features = ["tls"], optional = true }

[target.'cfg(any(target_os = "linux", all(target_os = "windows", target_arch = "x86_64", target_env = "msvc")))'.dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"], default-features = false }

[lints]
workspace = true
